name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# A second push landing on main while a deploy from the first is still
# running would otherwise race it on the VPS — two overlapping `docker
# compose up -d` runs against the same stack. Queues instead of running
# concurrently; never cancels a deploy that's actually in flight (which
# could leave the stack mid-restart).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase image paths — github.repository preserves
      # the repo's actual casing (Flames488/Safetee), so it must be
      # lowercased before use or the push step fails outright.
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/safetee-api" >> "$GITHUB_OUTPUT"

      # docker-compose.prod.yml's SAFETEE_IMAGE defaults to :latest — the
      # type=raw line below is what actually makes "deploy on every push to
      # main" pick up the new image, kept explicit rather than relying on
      # metadata-action's implicit latest=auto flavor. is_default_branch is
      # false for a tag push, so tagging an old commit for a deliberate
      # rollback never clobbers :latest with an older build.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/safetee
            bash infra/scripts/deploy.sh

      - name: Post-deploy health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ secrets.API_DOMAIN }}/health"; then
              echo "Deploy healthy"
              exit 0
            fi
            echo "Waiting for API to come up... ($i/10)"
            sleep 5
          done
          echo "Health check failed after deploy" >&2
          exit 1
