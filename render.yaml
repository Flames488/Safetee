# Render Blueprint — deploys the backend API plus managed Postgres and
# Redis. The frontend is deployed separately on Vercel (see
# frontend/vercel.json); once its URL is known, set ALLOWED_ORIGINS and
# FRONTEND_URL below in the Render dashboard and redeploy the API.
#
# No separate worker/beat services: Render's free tier has no free instance
# type for a Background Worker (starts at $7/mo), so safetee-worker and
# safetee-beat were previously declared here but never actually ran — every
# SOS alert, journey escalation, and password-reset SMS was silently queued
# into Redis with nothing consuming it. Delayed and periodic work now runs
# in-process on this same web service instead (see backend/app/core/
# scheduler.py and app/main.py's lifespan) at zero extra cost. If this ever
# needs to move to a real worker again (e.g. outgrowing the free web
# dyno), re-add these as paid Background Worker services and restore
# celery_app.conf.beat_schedule (see backend/app/workers/celery_app.py).
#
# Secrets marked `sync: false` are never committed — fill them in once in
# the Render dashboard after the first blueprint deploy.
databases:
  - name: safetee-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: redis
    name: safetee-redis
    plan: free
    ipAllowList: []

  - type: web
    name: safetee-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Free tier doesn't support preDeployCommand — migrations instead run
    # as part of the Docker image's default CMD (see backend/Dockerfile).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safetee-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safetee-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # after first deploy, copy this generated value into
                            # safetee-worker's and safetee-beat's SECRET_KEY too —
                            # all three must share one value to verify the same JWTs
      - key: ALLOWED_ORIGINS
        value: https://safetee.vercel.app,https://getsafetee.com,https://www.getsafetee.com
      - key: FRONTEND_URL
        value: https://www.getsafetee.com
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: ADMIN_MASTER_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
