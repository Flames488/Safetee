# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Postgres is self-hosted right here, same as the sibling Vitar project —
# deliberately not pointed at Supabase or any other pause-prone free-tier
# managed DB. Supabase is still used elsewhere (evidence file storage),
# but nothing on the request path from login to SOS trigger depends on it
# being up.
#
# api/worker/beat pull a pre-built image from GHCR (built by CI) rather than
# building locally — the production VPS is low-spec, and a `pip install`
# build under load is exactly the kind of thing that OOMs it. Set
# SAFETEE_IMAGE in .env to pin a specific tag; defaults to :latest.

services:
  postgres:
    restart: unless-stopped
    # Port publishing (localhost-only) lives on the base service in
    # docker-compose.yml — compose concatenates rather than replaces
    # `ports:` lists across -f files, so duplicating it here would
    # conflict with, not override, that entry.
    environment:
      POSTGRES_USER: safetee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a real POSTGRES_PASSWORD in .env}
      POSTGRES_DB: safetee
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=128MB
        -c effective_cache_size=384MB
        -c work_mem=4MB
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    image: ${SAFETEE_IMAGE:-ghcr.io/flames488/safetee/safetee-api:latest}
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000 --timeout 60
    restart: unless-stopped
    volumes: []
    environment:
      # A real worker/beat pair (below) now owns the periodic sweeps — see
      # app/main.py's lifespan and app/workers/celery_app.py's beat_schedule.
      RUN_PERIODIC_TASKS_IN_PROCESS: "false"
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ${SAFETEE_IMAGE:-ghcr.io/flames488/safetee/safetee-api:latest}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=500
    env_file: .env
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    volumes: []
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 15 2>&1 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    image: ${SAFETEE_IMAGE:-ghcr.io/flames488/safetee/safetee-api:latest}
    # Schedule file lives inside /app (already owned by the image's
    # non-root user — see Dockerfile) rather than a mounted volume, which
    # would need its own ownership fix to be writable. Not persisted
    # across restarts, but every scheduled task here is safely idempotent
    # (e.g. the daily purge just re-checks for already-expired rows), so
    # the worst case of losing "last run" bookkeeping is one task firing
    # a bit early once — not worth the extra moving part to prevent.
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule
    env_file: .env
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    # The image's baked-in HEALTHCHECK (an HTTP ping — see Dockerfile) is
    # meant for the api service; beat doesn't run a web server at all, so
    # it can never pass that check and shows a permanently misleading
    # "unhealthy" despite working correctly. Disable it here specifically.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Opt-in: only enable (`docker compose --profile pooling up -d`) if your
  # Postgres has NO connection pooling of its own — e.g. a self-managed
  # instance on a bare VPS. Do NOT stack this in front of an already-pooled
  # connection string (Supabase's transaction pooler, RDS Proxy, etc.) —
  # that exact redundant-pooling mistake was already made and flagged once
  # on a sibling project. If DATABASE_URL already points at a pooler, leave
  # this disabled and point the app straight at it.
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    profiles: ["pooling"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${UPSTREAM_DATABASE_URL:-}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 10
    ports:
      - "127.0.0.1:6432:6432"
    deploy:
      resources:
        limits:
          memory: 128M

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:changeme}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 192M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  prometheus_data:
  grafana_data:
