services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safetee
      POSTGRES_PASSWORD: safetee
      POSTGRES_DB: safetee
    # Localhost-only, in every environment including local dev — compose
    # concatenates `ports:` lists across -f files rather than replacing
    # them, so a wide-open base entry here would sit alongside prod's
    # 127.0.0.1-scoped one as two conflicting publishes on the same host
    # port instead of one correct one.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Localhost-only — an unauthenticated Redis (no requirepass configured)
    # exposed on 0.0.0.0 is a well-known, actively-scanned-for attack
    # target. See postgres's port comment above for why this lives on the
    # base service rather than a prod-only override.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Delayed/periodic work (SOS fanout, journey sweeps, password-reset SMS)
  # runs in-process on this container now — see app/core/scheduler.py and
  # app/main.py's lifespan. No separate worker/beat containers: Render's
  # free tier has no free Background Worker instance type, so those never
  # actually ran in production, and celery_app.py no longer defines a beat
  # schedule for them to consume even if started.
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    # Localhost-only in prod (nginx is the public entry point there); fine
    # for local dev too since you're hitting it from the same machine.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
