services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safetee
      POSTGRES_PASSWORD: safetee
      POSTGRES_DB: safetee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Delayed/periodic work (SOS fanout, journey sweeps, password-reset SMS)
  # runs in-process on this container now — see app/core/scheduler.py and
  # app/main.py's lifespan. No separate worker/beat containers: Render's
  # free tier has no free Background Worker instance type, so those never
  # actually ran in production, and celery_app.py no longer defines a beat
  # schedule for them to consume even if started.
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
