worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=sos_trigger:10m rate=5r/s;

    upstream safetee_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.safetee.app;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.safetee.app;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /health {
            proxy_pass http://safetee_api;
            access_log off;
        }

        # SOS trigger gets its own tighter, but still generous, rate limit —
        # a burst here is more likely a retry storm than abuse, so we throttle
        # softly (burst=10) rather than hard-blocking someone mid-emergency.
        location /api/v1/sos/trigger {
            limit_req zone=sos_trigger burst=10 nodelay;
            proxy_pass http://safetee_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://safetee_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://safetee_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
