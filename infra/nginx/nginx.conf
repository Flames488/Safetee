worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=sos_trigger:10m rate=5r/s;

    server {
        listen 80;
        server_name api.getsafetee.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.getsafetee.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Docker's embedded DNS (127.0.0.11) hands out a new address for
        # "api" every time that container is recreated on deploy. A static
        # `upstream { server api:8000; }` block only resolves once, at
        # nginx startup — after a deploy it keeps sending traffic to the
        # dead old address (was silently taking prod down after every
        # release until this was found). Putting the hostname in a
        # variable forces nginx to re-resolve it on every request instead,
        # so it self-heals with no dependency on restarting nginx at
        # deploy time. Trade-off: loses the upstream block's keepalive
        # connection pooling to the api container — a non-issue at this
        # traffic level next to "the API silently stops responding after
        # every deploy."
        resolver 127.0.0.11 valid=10s;
        set $api_backend api:8000;

        location /health {
            proxy_pass http://$api_backend;
            access_log off;
        }

        # SOS trigger gets its own tighter, but still generous, rate limit —
        # a burst here is more likely a retry storm than abuse, so we throttle
        # softly (burst=10) rather than hard-blocking someone mid-emergency.
        location /api/v1/sos/trigger {
            limit_req zone=sos_trigger burst=10 nodelay;
            proxy_pass http://$api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws/ {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://$api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
