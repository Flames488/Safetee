<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F6FA" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Runs before first paint, not inside React — otherwise there's a
      // visible flash of dark before the stored light preference applies.
      (function () {
        var saved = localStorage.getItem('safetee_theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      })();
    </script>

    <title>Safetee: Help reaches you before panic does</title>
    <meta name="description" content="Safetee is a personal safety platform: one-touch SOS, live location sharing, journey monitoring and trusted contacts, ready in seconds." />
    <meta name="keywords" content="personal safety app, SOS alert, live location sharing, safety check-in, trusted contacts, emergency alert app, Nigeria safety app" />
    <meta name="author" content="Safetee" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://getsafetee.com/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/favicon.svg" color="#2F8A17" />

    <!-- Installed / home-screen behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Safetee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Safetee" />
    <meta name="msapplication-TileColor" content="#060A0F" />

    <!-- Social previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Safetee" />
    <meta property="og:url" content="https://getsafetee.com/" />
    <meta property="og:title" content="Safetee: Help reaches you before panic does" />
    <meta property="og:description" content="One tap notifies your trusted contacts, shares your live location, and starts recording instantly." />
    <meta property="og:image" content="https://getsafetee.com/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Safetee: Help reaches you before panic does" />
    <meta name="twitter:description" content="One tap notifies your trusted contacts, shares your live location, and starts recording instantly." />
    <meta name="twitter:image" content="https://getsafetee.com/icon-512.png" />
    <meta name="twitter:site" content="@safeteeapp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Safetee",
        "url": "https://getsafetee.com/",
        "applicationCategory": "SafetyApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Safetee is a personal safety platform: one-touch SOS, live location sharing, journey monitoring and trusted contacts, ready in seconds.",
        "image": "https://getsafetee.com/icon-512.png",
        "offers": {
          "@type": "Offer",
          "price": "1500",
          "priceCurrency": "NGN"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Safetee needs JavaScript enabled to run. Please turn it on in your browser settings.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
