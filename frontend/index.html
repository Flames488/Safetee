<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060A0F" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Runs before first paint, not inside React — otherwise there's a
      // visible flash of dark before the stored light preference applies.
      (function () {
        var saved = localStorage.getItem('safetee_theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      })();
    </script>

    <title>Safetee — Help reaches you before panic does</title>
    <meta name="description" content="Safetee is a personal safety platform: one-touch SOS, live location sharing, journey monitoring and trusted contacts, ready in seconds." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installed / home-screen behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Safetee" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Social previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Safetee" />
    <meta property="og:title" content="Safetee — Help reaches you before panic does" />
    <meta property="og:description" content="One tap notifies your trusted contacts, shares your live location, and starts recording — instantly." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Safetee — Help reaches you before panic does" />
    <meta name="twitter:description" content="One tap notifies your trusted contacts, shares your live location, and starts recording — instantly." />
    <meta name="twitter:image" content="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Safetee needs JavaScript enabled to run — please turn it on in your browser settings.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
